# Noticed — Fly.io (SQLite on persistent volume)
# App name: aetn-noticed → https://aetn-noticed.fly.dev
# Secrets:
#   fly secrets set -a aetn-noticed \
#     DATABASE_URL='file:/data/noticed.db' \
#     NOTICED_OWNER_PASSWORD='...' \
#     NOTICED_SESSION_SECRET='...' \
#     NOTICED_PUBLIC_ORIGIN='https://aetn-noticed.fly.dev'

app = 'aetn-noticed'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3004'
  HOSTNAME = '0.0.0.0'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3004
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '45s'
  method = 'GET'
  path = '/.well-known/oauth-authorization-server'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1

[mounts]
  source = 'noticed_data'
  destination = '/data'
  initial_size = '1gb'
