# fly.toml app configuration file generated for aetn-noticed on 2026-07-28T23:13:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aetn-noticed'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOSTNAME = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3004'

[[mounts]]
  source = 'noticed_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3004
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/.well-known/oauth-authorization-server'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
